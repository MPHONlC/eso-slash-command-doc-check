name: 'Slash Command Doc Check'
description: 'Scans Lua source for registered slash commands and checks each is documented in your ESOUI, GitHub, and Bethesda docs.'
author: 'MPHONlC'
branding:
  icon: 'terminal'
  color: 'blue'

inputs:
  source_glob:
    description: 'Glob (recursive) matching your Lua source files'
    required: false
    default: '**/*.lua'
  esoui_file:
    description: 'Path to the ESOUI (BBCode) description file'
    required: false
    default: 'README_ESOUI.txt'
  github_file:
    description: 'Path to the GitHub-flavored markdown description file'
    required: false
    default: 'README.md'
  bethesda_file:
    description: 'Path to the Bethesda (plain markdown) description file'
    required: false
    default: 'README_BETHESDA.txt'

runs:
  using: 'composite'
  steps:
    - name: Check slash command documentation
      shell: bash
      run: |
        python3 "${{ github.action_path }}/check_slash_commands.py" \
          --source-glob "${{ inputs.source_glob }}" \
          --esoui-file "${{ inputs.esoui_file }}" \
          --github-file "${{ inputs.github_file }}" \
          --bethesda-file "${{ inputs.bethesda_file }}" \
          | tee -a "$GITHUB_STEP_SUMMARY"
