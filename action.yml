name: 'Slash Command Doc Check'
description: 'Scans Lua source for registered slash commands and checks each is documented in your doc files.'
author: 'MPHONlC'
branding:
  icon: 'terminal'
  color: 'blue'

inputs:
  source_glob:
    description: 'Glob (recursive) matching your Lua source files'
    required: false
    default: '**/*.lua'
  doc_files:
    description: 'List of doc files to check, one per line (or comma-separated)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check slash command documentation
      shell: bash
      run: |
        python3 "${{ github.action_path }}/check_slash_commands.py" \
          --source-glob "${{ inputs.source_glob }}" \
          --doc-files "${{ inputs.doc_files }}" \
          | tee -a "$GITHUB_STEP_SUMMARY"
